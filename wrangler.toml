# Cloudflare Pages + Functions 配置
#
# 用途：
#   1. 本地用 `npx wrangler pages dev dist` 跑通 Functions（含 KV 读写）时读取此文件；
#   2. 线上部署由 Pages 项目设置控制，KV 绑定在控制台里配置（见下方说明）。
#
# 关于 KV 绑定（重要）：
#   - 线上请不要把占位符写进这里。Pages 部署时会解析本文件的 [[kv_namespaces]]，
#     一旦 id 是占位字符串就会直接报
#     `Invalid KV namespace ID (REPLACE_WITH_YOUR_KV_NAMESPACE_ID)`，导致 Functions 发布失败。
#   - 线上绑定路径：Pages 项目 → Settings → Functions → KV namespace bindings
#     → Add binding，Variable name 填 MYNAV_KV，选你创建的命名空间。
#   - 本地调试时再解开下面注释，并把 id 换成真实值（wrangler kv namespace create MYNAV_KV 的输出）。
#
# [[kv_namespaces]]
# binding = "MYNAV_KV"
# id = "<你的 KV 命名空间 ID>"

name = "mynav"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"
